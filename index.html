cover{position:fixed;inset:0;background:#060811ba;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modal{background:#21253f;border:1px solid #535a7c;padding:25px;width:min(100%,500px);max-height:93vh;overflow:auto;border-radius:19px;box-shadow:0 30px 80px #000a}.modal h2{margin-bottom:8px}.footnote{color:var(--muted);font-size:12px;line-height:1.55}.info-list{line-height:1.9;color:var(--muted);font-size:13px}.top-close{float:right}.spark{color:var(--gold)}.bottomspacer{height:20px}@media(max-width:800px){.app{padding:16px 15px 100px}.grid{grid-template-columns:1fr}.hero{padding-top:25px}.metrics{gap:8px}.metric{padding:13px}.metric .number{font-size:25px}.card{padding:18px}.member-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.challenge-grid{grid-template-columns:1fr}.days{gap:4px}.entry{font-size:12px;padding:10px 1px}.topbar .brand{font-size:18px}.header-actions{width:100%;justify-content:space-between}.form-grid{grid-template-columns:1fr}}@media(max-width:370px){.days{gap:3px}.entry{padding:8px 1px;font-size:11px}.dname{font-size:10px!important}.metric .number{font-size:22px}.button{padding:10px}}

<script type="module">
const $=sel=>document.querySelector(sel);
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;});
function installed(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function isAppleMobile(){return /iPhone|iPad|iPod/i.test(navigator.userAgent)||(/Macintosh/i.test(navigator.userAgent)&&navigator.maxTouchPoints>1)}
function installSteps(){if(installed())return '<p class="muted">✓ Already added to your home screen.</p>';
 if(isAppleMobile())return '<p class="muted">For the best experience, use <strong>Safari</strong>:</p><ol class="install-steps"><li>Open this website in <strong>Safari</strong>.</li><li>Tap the <strong>Share</strong> icon (square with an upward arrow).</li><li>Choose <strong>Add to Home Screen</strong> and tap <strong>Add</strong>.</li></ol>';
 return '<p class="muted">On Samsung or Google Pixel:</p><ol class="install-steps"><li>Open this website in <strong>Chrome</strong> or Samsung Internet.</li><li>Tap the browser <strong>⋮ menu</strong>.</li><li>Choose <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li></ol>'}
function installModal(){return `<div class="modal-cover"><div class="modal" role="dialog" aria-modal="true" aria-label="Install app"><button type="button" class="button small ghost top-close" data-act="closeModal">✕</button><div class="eyebrow">YOUR CLUB, ONE TAP AWAY</div><h2>Install Better Together</h2><p class="footnote">Use it like an app on iPhone, Samsung, or Pixel. No App Store needed.</p>${installSteps()}${!installed()&&deferredInstallPrompt?'<button type="button" class="button primary" style="width:100%" data-act="nativeInstall">Install app now</button>':''}<p class="footnote">Installation requires a live HTTPS website. The downloaded HTML file is only a demo.</p><button class="button" data-act="closeModal" style="width:100%;margin-top:8px">Close</button></div></div>`}
window.addEventListener('online',()=>{document.querySelector('#offlineNotice')?.remove()});
window.addEventListener('offline',()=>{if(!document.querySelector('#offlineNotice'))document.body.insertAdjacentHTML('afterbegin','<div id="offlineNotice" class="connection-notice">You are offline. Check-ins need internet access to sync.</div>')});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn));

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>localDay(new Date());
function localDay(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDay(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(day,n){const d=parseDay(day);d.setDate(d.getDate()+n);return localDay(d)}
function monday(day){const d=parseDay(day);return addDays(day,-(d.getDay()+6)%7)}
function daysOf(week){return Array.from({length:7},(_,i)=>addDays(week,i))}
function monthKey(day){return day.slice(0,7)}
function monthShift(m,n){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return localDay(d).slice(0,7)}
function monthWeeks(month){const [y,m]=month.split('-').map(Number);let d=new Date(y,m-1,1),a=[];while(d.getMonth()===m-1){let w=monday(localDay(d));if(!a.includes(w)&&w.slice(0,7)===month)a.push(w);d.setDate(d.getDate()+1)}return a}
function fmt(day,opts={month:'short',day:'numeric'}){return parseDay(day).toLocaleDateString('en-US',opts)}
function fmtWeek(w){return `${fmt(w)} – ${fmt(addDays(w,6))}`}
function clamp(v){return Math.max(0,Math.min(100,v))}
function uid(){return Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6)}
function initials(name){return String(name||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function plural(n,word){return `${n} ${word}${n===1?'':'s'}`}
const icons={max_daily:'📵',min_weekly:'🏋️',min_daily:'✨'};
const defaults=[
 {title:'Entertainment screen time',type:'max_daily',target:120,unit:'minutes',emoji:'📱'},
 {title:'Gym or exercise',type:'min_weekly',target:180,unit:'minutes',emoji:'💪'},
 {title:'Gayatri mantra',type:'min_daily',target:11,unit:'chants',emoji:'🪷'}
];
const cfg=JSON.parse($('#firebase-config').textContent||'{}');
const cloudMode=Boolean(cfg.apiKey&&cfg.projectId&&cfg.authDomain&&cfg.appId);
let state={mode:cloudMode?'cloud':'demo',room:null,roomName:'The Consistency Club',user:null,members:[],challenges:[],logs:[],week:monday(today()),month:monthKey(today()),view:'dashboard',modal:null,loading:false,weekProfile:null};
let fb={},unsubs=[];
let toastTimer;
function alertToast(message,error=false){const el=$('#toast');el.innerHTML=`<div class="toast ${error?'error':''}">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',3600)}
function newChallenge(challenge,week,createdBy,startDate=week){return {id:uid(),title:challenge.title,type:challenge.type,target:Number(challenge.target),unit:challenge.unit,emoji:challenge.emoji||icons[challenge.type],week,startDate,createdBy,createdAt:Date.now()}}
function seedDemo(){const week=state.week;const last=addDays(week,-7);const names=['You','Arjun','Ravi','Priya','Kiran','Anil','Meera','Vikram'];const members=names.map((name,i)=>({uid:'demo'+i,name}));const challenges=[...defaults.map(d=>newChallenge(d,last,'demo0')),...defaults.map(d=>newChallenge(d,week,'demo0'))];let logs=[];
 // Sample entries are intentionally labeled demo and do not represent real activity.
 for(let mi=0;mi<8;mi++)for(const ch of challenges){for(let di=0;di<7;di++){const day=addDays(ch.week,di);if(day>today())continue;const val=ch.type==='max_daily'?(mi===0?110:88+((mi*29+di*19)%91)):ch.type==='min_daily'?Math.max(0,12-((mi+di*2)%5)):([0,35,50,0,60,40,0][di]+(mi%3)*3);if(mi===0&&ch.week===week&&di>1)continue;logs.push({id:`${members[mi].uid}_${ch.id}_${day}`,memberId:members[mi].uid,challengeId:ch.id,date:day,value:val})}}
 return {members,challenges,logs,userId:'demo0',roomName:'The Consistency Club'};
}
function saveDemo(){if(state.mode!=='demo')return;localStorage.setItem('better_together_demo_v1',JSON.stringify({members:state.members,challenges:state.challenges,logs:state.logs,userId:state.user?.uid,roomName:state.roomName}))}
function initDemo(){let stored;try{stored=JSON.parse(localStorage.getItem('better_together_demo_v1')||'null')}catch{};const a=stored&&Array.isArray(stored.challenges)&&Array.isArray(stored.members)?stored:seedDemo();state.members=a.members;state.challenges=a.challenges;state.logs=a.logs;state.roomName=a.roomName||'The Consistency Club';state.user=state.members.find(m=>m.uid===a.userId)||state.members[0];state.room='LOCAL-DEMO';saveDemo();render()}
function dataFor(ch,memberId){return state.logs.filter(x=>x.memberId===memberId&&x.challengeId===ch.id&&x.date>=ch.week&&x.date<=addDays(ch.week,6))}
function challengeScore(ch,memberId){const entries=dataFor(ch,memberId);const map=new Map(entries.map(x=>[x.date,Number(x.value)]));const end=today()<addDays(ch.week,6)?today():addDays(ch.week,6);if(ch.week>today()||ch.startDate>end)return 0;
 if(ch.type==='min_weekly')return clamp(100*entries.reduce((sum,x)=>sum+Number(x.value||0),0)/ch.target);
 const eligible=daysOf(ch.week).filter(d=>d>=ch.startDate&&d<=end);if(!eligible.length)return 0;
 return eligible.reduce((sum,d)=>{if(!map.has(d))return sum;let v=map.get(d);return sum+(ch.type==='max_daily'?(v<=ch.target?100:100*ch.target/Math.max(v,1)):100*Math.min(1,v/ch.target))},0)/eligible.length;
}
function weeklyScore(w,memberId){const arr=state.challenges.filter(c=>c.week===w);return arr.length?arr.reduce((s,c)=>s+challengeScore(c,memberId),0)/arr.length:0}
function memberMonth(memberId){const weeks=monthWeeks(state.month).filter(w=>w<=monday(today())&&state.challenges.some(c=>c.week===w));if(!weeks.length)return {score:0,average:0,consistency:0,completed:0,weeks:0};const scores=weeks.map(w=>weeklyScore(w,memberId));const avg=scores.reduce((a,b)=>a+b,0)/weeks.length;const completed=scores.filter(n=>n>=90).length;const consistency=100*completed/weeks.length;return {score:.8*avg+.2*consistency,average:avg,consistency,completed,weeks:weeks.length}}
function ranking(){return state.members.map(m=>({...m,...memberMonth(m.uid)})).sort((a,b)=>b.score-a.score||b.average-a.average||a.name.localeCompare(b.name))}
function weekChallenges(){return state.challenges.filter(c=>c.week===state.week).sort((a,b)=>a.createdAt-b.createdAt)}
function userName(){return state.user?.name||'Friend'}
function canLog(d){return d<=today() && d>=state.week && state.week===monday(today())}
function progressHTML(p,color=''){return `<div class="progress ${color}"><span style="width:${clamp(p).toFixed(2)}%"></span></div>`}
function circle(name){return `<div class="avatar">${esc(initials(name))}</div>`}
function empty(icon,title,msg){return `<div class="empty"><div class="emoji">${icon}</div><h3>${title}</h3><p>${msg}</p></div>`}
function weekHeader(){return `<div class="week-head"><div><div class="eyebrow" style="margin-bottom:5px">SELECTED WEEK</div><div class="date-label">${fmtWeek(state.week)}</div></div><div class="controls"><button class="button small" data-act="prevWeek" aria-label="Previous week">←</button><button class="button small" data-act="thisWeek">This week</button><button class="button small" data-act="nextWeek" aria-label="Next week">→</button></div></div>`}
function monthHeader(){return `<div class="month-head"><div><div class="eyebrow" style="margin-bottom:6px">MONTHLY RACE</div><h2>${parseDay(state.month+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2></div><div class="controls"><button class="button small" data-act="prevMonth">←</button><button class="button small" data-act="thisMonth">Current</button><button class="button small" data-act="nextMonth">→</button></div></div>`}
function header(){return `<div class="topbar"><div class="flex"><div class="brandmark">✓</div><div><div class="brand">BETTER TOGETHER</div><span class="subbrand">The weekly challenge club</span></div></div><div class="header-actions"><span class="pill ${state.mode==='cloud'?'live':'demo'}">● ${state.mode==='cloud'?'Live group':'Local demo · sample data'}</span><span class="pill">👥 ${state.members.length}/8 friends</span><button class="button small ghost install-nav" data-act="install">⇩ Install</button><button class="button small ghost" data-act="settings">⚙ Settings</button></div></div><div class="hero"><div class="eyebrow">Small actions. Big consistency.</div><div class="between" style="align-items:flex-end;flex-wrap:wrap"><div><h1>Keep your promises, <span style="color:var(--mint)">together.</span></h1><p>Track daily habits, complete weekly goals, and rise on the monthly leaderboard.</p></div><button class="button primary" data-act="addChallenge">+ New challenge</button></div></div><div class="tabs">${[['dashboard','Overview'],['log','My check-ins'],['leaderboard','Leaderboard'],['challenges','Challenges'],['friends','Friends']].map(([v,t])=>`<button class="tab ${state.view===v?'active':''}" data-act="view" data-view="${v}">${t}</button>`).join('')}</div>`}
function dashboard(){const cs=weekChallenges();const weekly=weeklyScore(state.week,state.user.uid);const mine=memberMonth(state.user.uid);const ranks=ranking();const myrank=ranks.findIndex(m=>m.uid===state.user.uid)+1;return `${weekHeader()}<div class="grid"><div class="stack"><section class="card highlight"><div class="card-head"><div><div class="eyebrow">YOUR MOMENTUM</div><h2>Show up for yourself.</h2></div><span class="tag">${state.week===monday(today())?'Live week':'Selected week'}</span></div><div class="metrics"><div class="metric"><div class="number">${Math.round(weekly)}%</div><small>Weekly goal score</small></div><div class="metric"><div class="number">#${myrank||'–'}</div><small>Monthly rank</small></div><div class="metric"><div class="number">${mine.completed}/${mine.weeks}</div><small>Strong weeks (90%+)</small></div></div>${progressHTML(weekly)}<div class="statline"><span>This week's challenge average</span><span>${Math.round(weekly)} / 100</span></div></section><section class="card"><div class="card-head"><h2>This week's promises</h2><button class="button small" data-act="view" data-view="log">Log activity →</button></div>${cs.length?cs.map(c=>{let score=challengeScore(c,state.user.uid),vals=dataFor(c,state.user.uid),total=vals.reduce((a,b)=>a+Number(b.value||0),0);let detail=c.type==='min_weekly'?`${total} / ${c.target} ${c.unit}`:c.type==='max_daily'?`Max ${c.target} ${c.unit}/day`:`${c.target} ${c.unit}/day`;return `<div class="challenge-row"><div class="between"><div class="flex"><div class="challenge-icon">${esc(c.emoji)}</div><div><div class="title-sm">${esc(c.title)}</div><div class="label-sm">${esc(detail)}</div></div></div><div class="value">${Math.round(score)}%</div></div>${progressHTML(score,c.type==='min_daily'?'purple':c.type==='max_daily'?'gold':'')}</div>`}).join(''):empty('🎯','No goals published yet','Add a challenge or copy last week’s goals.')}</section></div><div class="stack"><section class="card"><div class="card-head"><h2>Monthly front-runners</h2><button class="button small ghost" data-act="view" data-view="leaderboard">View all →</button></div>${ranks.slice(0,5).map((p,i)=>`<div class="rank-row"><span class="rank">${i===0?'🏆':`#${i+1}`}</span>${circle(p.name)}<div style="flex:1;min-width:0"><div class="between"><strong style="font-size:13px">${esc(p.name)} ${p.uid===state.user.uid?'(you)':''}</strong><b>${Math.round(p.score)}%</b></div><div class="rank-bar"><div style="width:${clamp(p.score)}%"></div></div></div></div>`).join('')}</section><section class="card"><div class="card-head"><h2>How winners are chosen</h2><span class="tag">Fair play</span></div><p class="mini" style="font-size:13px">Your monthly score rewards steady effort—not just one great week.</p><div class="row-wrap" style="margin:16px 0"><span class="chip">80% average weekly score</span><span class="chip">20% consistency</span></div><p class="footnote">A “strong week” scores at least 90%. Missing check-ins count as zero. Goals are shared by everyone. Monthly results are provisional until the month ends.</p></section></div></div>`}
function logPage(){const cs=weekChallenges();return `${weekHeader()}<div class="note" style="margin-bottom:18px">✍️ Record your actual activity. For entertainment time, enter minutes spent (0 is valid). Only the current week is editable; previous weeks remain visible.</div>${cs.length?cs.map(c=>{const data=new Map(dataFor(c,state.user.uid).map(x=>[x.date,x.value]));return `<section class="card" style="margin-bottom:15px"><div class="between"><div class="flex"><div class="challenge-icon">${esc(c.emoji)}</div><div><h3 style="margin:0">${esc(c.title)}</h3><div class="label-sm">${c.type==='max_daily'?'Stay at or below':c.type==='min_daily'?'Reach at least':'Reach total of'} ${c.target} ${esc(c.unit)}${c.type==='min_weekly'?' / week':' / day'}</div></div></div><div class="value">${Math.round(challengeScore(c,state.user.uid))}%</div></div>${progressHTML(challengeScore(c,state.user.uid))}<div class="days">${daysOf(state.week).map((d,i)=>`<div class="day-cell"><div class="dname">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</div><div class="dnum">${fmt(d,{day:'numeric'})}</div><input class="entry ${data.has(d)?'saved':''}" aria-label="${esc(c.title)} ${fmt(d)}" type="number" inputmode="decimal" min="0" step="any" placeholder="—" data-log="1" data-date="${d}" data-challenge="${c.id}" value="${data.has(d)?esc(data.get(d)):''}" ${!canLog(d)||d<c.startDate?'disabled':''}></div>`).join('')}</div><div class="between" style="margin-top:13px"><span class="footnote">Units: ${esc(c.unit)} · ${c.type==='min_weekly'?'Weekly total':c.type==='max_daily'?'Daily maximum':'Daily minimum'}</span><span class="footnote">Autosaves on change ✓</span></div></section>`}).join(''):empty('📝','No challenges this week','Create a challenge to begin tracking.')}${cs.length===0?`<div class="controls"><button class="button primary" data-act="addChallenge">+ New challenge</button><button class="button" data-act="copyWeek">Copy previous week</button></div>`:''}`}
function leaderboard(){const ranks=ranking();const lead=ranks[0];const monthFinished=state.month<monthKey(today());return `${monthHeader()}<div class="grid"><div class="card"><div class="leader-banner"><div class="between"><div><div class="eyebrow">${monthFinished?'MONTHLY CHAMPION':'CURRENT LEADER · PROVISIONAL'}</div><div class="winner">${lead&&lead.weeks?esc(lead.name):'Nobody yet'}</div><div class="muted" style="font-size:13px">${lead&&lead.weeks?`${lead.score.toFixed(1)} overall points · ${lead.completed} strong weeks`:'Start logging to appear on the board'}</div></div><div class="trophy">🏆</div></div></div>${ranks.map((p,i)=>`<div class="rank-row" style="padding:15px 3px"><span class="rank" style="min-width:28px">${i+1}.</span>${circle(p.name)}<div style="flex:1;min-width:0"><div class="between"><strong>${esc(p.name)} ${p.uid===state.user.uid?'(you)':''}</strong><b>${p.score.toFixed(1)} pts</b></div><div class="rank-bar"><div style="width:${clamp(p.score)}%"></div></div><div class="footnote" style="margin-top:5px">Weekly average ${Math.round(p.average)}% · ${p.completed}/${p.weeks} strong weeks</div></div></div>`).join('')}</div><div class="stack"><div class="card"><h2>Week-by-week consistency</h2><p class="footnote">Scores are calculated for every published week in this month.</p>${monthWeeks(state.month).filter(w=>w<=monday(today())&&state.challenges.some(c=>c.week===w)).map(w=>{let s=weeklyScore(w,state.user.uid);return `<div class="challenge-row"><div class="between"><div><strong style="font-size:13px">${fmtWeek(w)}</strong><div class="footnote">${w===monday(today())?'In progress':s>=90?'Strong week ✓':'Completed week'}</div></div><b>${Math.round(s)}%</b></div>${progressHTML(s)}</div>`}).join('')||empty('📅','No scored weeks','Publish weekly goals first.')}</div><div class="card"><h3>Scoring explained</h3><p class="footnote">A goal's score ranges from 0–100%. Daily goals average logged days; missed check-ins count as 0. Weekly exercise scores against the target total. Entertainment above its daily limit gets partial credit: target ÷ actual time. Monthly score = 80% of your average weekly score + 20% of the percentage of weeks scoring 90% or more.</p></div></div></div>`}
function challengesPage(){const cs=weekChallenges();return `${weekHeader()}<div class="section-title"><div><h2>Group challenges</h2><p class="footnote" style="margin:4px 0 0">All friends share the same goals for fairness. Anyone can suggest one.</p></div><div class="controls"><button class="button small" data-act="copyWeek">⧉ Copy previous week</button><button class="button primary small" data-act="addChallenge">+ Add goal</button></div></div><div class="challenge-grid">${cs.map(c=>{let owner=state.members.find(x=>x.uid===c.createdBy)?.name||'Friend';return `<section class="card challenge-card"><div class="between"><div class="challenge-icon">${esc(c.emoji)}</div><span class="chip">${c.type==='min_weekly'?'Weekly minimum':c.type==='min_daily'?'Daily minimum':'Daily maximum'}</span></div><h3 style="margin-top:18px">${esc(c.title)}</h3><div class="muted" style="font-size:13px">${c.type==='max_daily'?'No more than': 'At least'} <strong style="color:var(--text)">${c.target} ${esc(c.unit)}</strong> ${c.type==='min_weekly'?'each week':'each day'}</div>${progressHTML(challengeScore(c,state.user.uid))}<div class="between"><span class="footnote">Added by ${esc(owner)}${c.startDate>c.week?' · starts '+fmt(c.startDate):''}</span>${c.createdBy===state.user.uid&&state.week>=monday(today())?`<button class="button small ghost warning" data-act="deleteChallenge" data-id="${c.id}">Remove</button>`:''}</div></section>`}).join('')}${!cs.length?`<div class="card">${empty('🎯','A fresh week awaits','Copy previous goals or add new ones.')}</div>`:''}</div><p class="footnote" style="margin-top:16px">New daily challenges added during the week start scoring from the day they are created. Removing a goal deletes it from this week's scoring.</p>`}
function friendsPage(){return `<div class="section-title"><div><h2>Your circle</h2><p class="footnote" style="margin:5px 0 0">Invite up to eight members who keep one another accountable.</p></div>${state.mode==='demo'?`<button class="button small" data-act="addFriend">+ Add friend</button>`:''}</div><section class="card" style="margin-bottom:18px"><div class="between" style="flex-wrap:wrap"><div><div class="eyebrow">${state.mode==='cloud'?'INVITE CODE':'LOCAL DEMO'}</div><div class="code">${state.mode==='cloud'?esc(state.room):'NOT CONNECTED'}</div><p class="footnote" style="margin:8px 0 0">${state.mode==='cloud'?'Share the invite link so friends can join from their phones.':'This file stores data only in this browser. See setup guide for live sharing.'}</p></div>${state.mode==='cloud'?`<button class="button primary" data-act="share">Copy invite link</button>`:`<button class="button" data-act="settings">How to go live →</button>`}</div></section><div class="member-grid">${state.members.map(m=>`<div class="member">${circle(m.name)}<strong>${esc(m.name)}</strong><small>${m.uid===state.user.uid?'You':state.mode==='demo'?'Demo friend':'Member'}</small>${state.mode==='demo'?`<div style="margin-top:10px"><button class="button small" data-act="switchDemo" data-id="${m.uid}">Switch</button><button class="button small ghost" data-act="renameDemo" data-id="${m.uid}">✎</button></div>`:''}</div>`).join('')}</div>`}
function settingsModal(){return `<div class="modal-cover"><div class="modal" role="dialog" aria-modal="true" aria-label="Settings"><button class="button small ghost top-close" data-act="closeModal">✕</button><div class="eyebrow">CLUB SETTINGS</div><h2>${esc(state.roomName)}</h2><p class="footnote">Signed in as ${esc(userName())} · ${state.mode==='cloud'?'Live Firebase sync':'Local demo only'}</p><div class="note" style="margin:20px 0">📱 This HTML site cannot automatically access your phone's Digital Wellbeing / Screen Time data. Members manually enter their numbers. You can check weekly screenshots for added accountability.</div>${state.mode==='demo'?`<button class="button" data-act="resetDemo">Reset sample demo</button><button class="button" style="margin-left:7px" data-act="exportDemo">Export JSON backup</button><label class="button" style="display:inline-block;margin-top:12px">Import JSON backup <input type="file" id="importFile" accept=".json,application/json" hidden></label><p class="footnote" style="margin:15px 0 0">To activate shared mode: set your Firebase project config in index.html, publish Firestore rules, enable Google sign-in and host on HTTPS. See SETUP.md.</p>`:`<div class="controls"><button class="button" data-act="share">Copy invite link</button><button class="button warning" data-act="leaveGroup">Stop viewing group</button><button class="button" data-act="signOut">Sign out</button></div>`}<div class="bottomspacer"></div><button class="button primary" data-act="closeModal" style="width:100%">Done</button></div></div>`}
function addModal(){return `<div class="modal-cover"><form id="challengeForm" class="modal" role="dialog" aria-modal="true"><button type="button" class="button small ghost top-close" data-act="closeModal">✕</button><div class="eyebrow">NEW GROUP PROMISE</div><h2>Add a challenge</h2><p class="footnote">For week ${fmtWeek(state.week)}. Everyone participates in the same challenge.</p><div class="field"><label for="ctitle">Challenge name</label><input class="input" name="title" id="ctitle" maxlength="64" required placeholder="e.g. Read a book" autofocus></div><div class="form-grid"><div class="field"><label for="ctype">Goal rule</label><select class="select" name="type" id="ctype"><option value="min_daily">Daily minimum</option><option value="max_daily">Daily maximum</option><option value="min_weekly">Weekly minimum</option></select></div><div class="field"><label for="ctarget">Target</label><input class="input" id="ctarget" type="number" name="target" min="0.01" step="any" required placeholder="e.g. 20"></div></div><div class="form-grid"><div class="field"><label for="cunit">Unit</label><input class="input" id="cunit" name="unit" maxlength="24" value="minutes" placeholder="minutes, chants, pages" required></div><div class="field"><label for="cemoji">Emoji</label><input class="input" id="cemoji" name="emoji" maxlength="5" value="🎯"></div></div><div class="note" style="margin-bottom:15px">${state.week===monday(today())?'A goal added midweek starts from today, not Monday.':state.week>monday(today())?'This goal will begin at the start of its selected future week.':'Past weeks cannot be edited.'}</div><button class="button primary" type="submit" style="width:100%" ${state.week<monday(today())?'disabled':''}>Publish challenge for the group</button></form></div>`}
function render(){if(state.mode==='cloud'&&(!state.user||!state.room)){renderSetup();return};$('#root').innerHTML=`<div class="app">${header()}${state.view==='dashboard'?dashboard():state.view==='log'?logPage():state.view==='leaderboard'?leaderboard():state.view==='challenges'?challengesPage():friendsPage()}</div>`;$('#overlay').innerHTML=state.modal==='settings'?settingsModal():state.modal==='add'?addModal():state.modal==='install'?installModal():''}
function renderSetup(){$('#overlay').innerHTML=state.modal==='install'?installModal():'';if(!state.user){$('#root').innerHTML=`<div class="app"><div class="setup"><div class="flex" style="margin-bottom:28px"><div class="brandmark">✓</div><div class="brand">BETTER TOGETHER</div></div><div class="card highlight"><div class="eyebrow">EIGHT FRIENDS. ONE BETTER MONTH.</div><h1>Keep your promises, together.</h1><p class="muted">Make shared weekly challenges, log your progress, and celebrate the most consistent person every month.</p><div class="row-wrap" style="margin:22px 0"><span class="chip">📵 Screen time</span><span class="chip">💪 Gym</span><span class="chip">🪷 Mantra</span></div><button class="button primary" id="googleSignIn" style="width:100%">Continue with Google →</button>
<div class="auth-divider">or sign in with email</div>
<div class="auth-mode"><button type="button" id="emailModeLogin" class="selected" data-auth-mode="login">Sign in</button><button type="button" id="emailModeRegister" data-auth-mode="register">Create account</button></div>
<form id="emailAuthForm" data-mode="login">
 <div class="field" id="registerNameField" style="display:none"><label for="registerName">Your name</label><input class="input" id="registerName" name="name" maxlength="45" autocomplete="name" placeholder="What should your friends call you?"></div>
 <div class="field"><label for="emailAddress">Email</label><input class="input" type="email" id="emailAddress" name="email" autocomplete="email" placeholder="you@example.com" required></div>
 <div class="field"><label for="emailPassword">Password</label><input class="input" type="password" id="emailPassword" name="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters" required></div>
 <button class="button" type="submit" style="width:100%" id="emailAuthSubmit">Sign in with email →</button>
</form>
<p class="footnote" style="margin-top:15px;text-align:center">Only your group can see your check-ins. Each friend has their own account.</p>
<div class="app-install-cta"><button class="button small ghost" data-act="install">⇩ Add to home screen</button><p>Works on iPhone, Samsung and Pixel</p></div></div></div></div>`;return}
 const invited=(new URLSearchParams(location.search)).get('room')||'';
 $('#root').innerHTML=`<div class="app"><div class="setup"><div class="flex" style="margin-bottom:28px"><div class="brandmark">✓</div><div class="brand">BETTER TOGETHER</div></div><div class="card"><div class="eyebrow">WELCOME, ${esc(userName()).toUpperCase()}</div><h1>Your challenge circle starts here.</h1><p class="muted">Create a private group, or join your friend's circle using their code.</p><div class="segmented" id="roomTabs"><button class="${invited?'':'active'}" data-roomtab="create">Create a group</button><button class="${invited?'active':''}" data-roomtab="join">Join with code</button></div><form id="roomForm" style="margin-top:22px" data-roomtype="${invited?'join':'create'}"><div class="field"><label for="roomText">${invited?'8-character invite code':'Group name'}</label><input class="input" id="roomText" name="roomText" maxlength="60" required value="${invited?esc(invited):'The Consistency Club'}"></div><button class="button primary" style="width:100%" type="submit">${invited?'Join my friends':'Create group'} →</button></form><p class="footnote" style="margin:16px 0 0">Each friend uses their own Google account so their entries remain separate.</p></div></div></div>`}
function showModal(which){state.modal=which;render();if(which==='add')$('#ctitle')?.focus()}
function closeModal(){state.modal=null;render()}
async function doSaveChallenge(c){if(state.mode==='demo'){state.challenges.push(c);saveDemo()}else await fb.setDoc(fb.doc(fb.db,'rooms',state.room,'challenges',c.id),c);render();alertToast('Challenge added to the group')}
async function saveLog(challengeId,day,val){if(state.mode==='cloud'&&!navigator.onLine)throw Error('No internet. Reconnect to sync your check-in.');const ch=state.challenges.find(c=>c.id===challengeId);if(!ch||!canLog(day)||day<ch.startDate)return alertToast('This date is read-only',true);const id=`${state.user.uid}_${challengeId}_${day}`;const prior=state.logs.find(x=>x.id===id);if(val===''||val==null){if(state.mode==='demo'){state.logs=state.logs.filter(x=>x.id!==id);saveDemo()}else await fb.deleteDoc(fb.doc(fb.db,'rooms',state.room,'logs',id));render();return}const v=Number(val);if(!Number.isFinite(v)||v<0||v>10000000){alertToast('Enter a valid number',true);render();return}const obj={id,memberId:state.user.uid,challengeId,date:day,value:v,updatedAt:Date.now()};if(state.mode==='demo'){if(prior)Object.assign(prior,obj);else state.logs.push(obj);saveDemo()}else await fb.setDoc(fb.doc(fb.db,'rooms',state.room,'logs',id),obj);render();alertToast('Check-in saved ✓')}
async function copyWeek(){if(state.week<monday(today()))return alertToast('Previous weeks are locked',true);const prev=addDays(state.week,-7),source=state.challenges.filter(c=>c.week===prev),current=weekChallenges();if(!source.length)return alertToast('No challenges found in the previous week',true);const newOnes=source.filter(c=>!current.some(e=>e.title.trim().toLowerCase()===c.title.trim().toLowerCase())).map(c=>newChallenge(c,state.week,state.user.uid,state.week));if(!newOnes.length)return alertToast('All previous goals are already copied');if(state.mode==='demo'){state.challenges.push(...newOnes);saveDemo()}else await Promise.all(newOnes.map(c=>fb.setDoc(fb.doc(fb.db,'rooms',state.room,'challenges',c.id),c)));render();alertToast(`${newOnes.length} challenge${newOnes.length===1?'':'s'} copied ✓`)}
async function deleteChallenge(id){let c=state.challenges.find(x=>x.id===id);if(!c||c.createdBy!==state.user.uid||state.week<monday(today()))return;if(!confirm(`Remove “${c.title}” from this week for everyone?`))return;if(state.mode==='demo'){state.challenges=state.challenges.filter(x=>x.id!==id);saveDemo()}else await fb.deleteDoc(fb.doc(fb.db,'rooms',state.room,'challenges',id));render();alertToast('Challenge removed')}
function download(filename,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=filename;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function act(name,b){if(name==='install'){showModal('install');return}if(name==='nativeInstall'){if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;closeModal()}return}if(name==='view'){state.view=b.dataset.view;render();return}if(name==='closeModal'){closeModal();return}if(name==='settings'){showModal('settings');return}if(name==='addChallenge'){if(state.week<monday(today()))return alertToast('Past weeks are locked',true);showModal('add');return}if(name==='prevWeek')state.week=addDays(state.week,-7);if(name==='nextWeek')state.week=addDays(state.week,7);if(name==='thisWeek')state.week=monday(today());if(name==='prevMonth')state.month=monthShift(state.month,-1);if(name==='nextMonth')state.month=monthShift(state.month,1);if(name==='thisMonth')state.month=monthKey(today());if(name==='copyWeek')return copyWeek();if(name==='deleteChallenge')return deleteChallenge(b.dataset.id);if(name==='share'){const u=new URL(location.href);u.searchParams.set('room',state.room);try{await navigator.clipboard.writeText(u.toString());alertToast('Invite link copied ✓')}catch{prompt('Copy this invite link:',u.toString())}return}if(name==='switchDemo'){state.user=state.members.find(m=>m.uid===b.dataset.id);saveDemo();state.view='dashboard';alertToast(`Viewing as ${state.user.name}`)}if(name==='renameDemo'){const m=state.members.find(x=>x.uid===b.dataset.id),n=prompt('Friend name:',m?.name);if(n&&n.trim()){m.name=n.trim().slice(0,45);saveDemo();if(state.user.uid===m.uid)state.user=m}}if(name==='addFriend'){if(state.members.length>=8)return alertToast('Maximum 8 friends',true);let name=prompt('New friend name:');if(name?.trim()){state.members.push({uid:'demo'+uid(),name:name.trim().slice(0,45)});saveDemo()}}if(name==='resetDemo'){if(confirm('Reset ALL local demo data?')){localStorage.removeItem('better_together_demo_v1');state.week=monday(today());state.month=monthKey(today());state.modal=null;initDemo();alertToast('Demo reset')}}if(name==='exportDemo')download('better-together-backup.json',JSON.stringify({members:state.members,challenges:state.challenges,logs:state.logs,userId:state.user.uid,roomName:state.roomName},null,2));if(name==='signOut'){clearSubscriptions();localStorage.removeItem('better_together_room_'+state.user.uid);state.modal=null;await fb.signOut(fb.auth)}if(name==='leaveGroup'){if(!confirm('Stop viewing this group on this device? Your membership and past check-ins will remain so you can rejoin later.'))return;clearSubscriptions();localStorage.removeItem('better_together_room_'+state.user.uid);state.room=null;state.modal=null;state.members=[];render()}if(!name||!['resetDemo','signOut','leaveGroup'].includes(name))render()}
function clearSubscriptions(){unsubs.forEach(un=>un());unsubs=[]}
function startRoom(code){state.room=code;state.modal=null;clearSubscriptions();localStorage.setItem('better_together_room_'+state.user.uid,code);let r=fb.doc(fb.db,'rooms',code);unsubs.push(fb.onSnapshot(r,s=>{if(s.exists()){state.roomName=s.data().name||'The Consistency Club';render()}},e=>alertToast(e.message,true)));for(const name of ['members','challenges','logs'])unsubs.push(fb.onSnapshot(fb.collection(fb.db,'rooms',code,name),snap=>{state[name]=snap.docs.map(x=>({id:x.id,...x.data()}));render()},e=>alertToast('Sync error: '+e.message,true)));render()}
async function firebaseInit(){try{const base='https://www.gstatic.com/firebasejs/12.19.0/';const [appMod,authMod,fireMod]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);fb={...authMod,...fireMod};const app=appMod.initializeApp(cfg);fb.auth=authMod.getAuth(app);fb.db=fireMod.getFirestore(app);authMod.onAuthStateChanged(fb.auth,user=>{if(user){state.user={uid:user.uid,name:user.displayName||user.email?.split('@')[0]||'Friend'};const code=localStorage.getItem('better_together_room_'+user.uid);if(code)startRoom(code);else renderSetup()}else{clearSubscriptions();state.user=null;state.room=null;state.members=[];state.challenges=[];state.logs=[];renderSetup()}})}catch(e){console.error(e);$('#root').innerHTML=`<div class="app"><div class="setup card"><h2>Could not start cloud mode</h2><p class="muted">Check Firebase configuration and internet access.</p><p class="footnote">${esc(e.message)}</p></div></div>`}}
async function createOrJoin(type,value){
 const name=state.user.name;
 const code=type==='create'?Array.from(crypto.getRandomValues(new Uint8Array(8)),n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join(''):value.trim().toUpperCase();
 if(type==='join'&&!/^[A-Z2-9]{8}$/.test(code))return alertToast('Use the 8-character group code',true);
 if(type==='create'&&!value.trim())return alertToast('Give your group a name',true);
 const mem={uid:state.user.uid,name,joinedAt:Date.now()},roomRef=fb.doc(fb.db,'rooms',code),memberRef=fb.doc(fb.db,'rooms',code,'members',state.user.uid);
 try{
  if(type==='create'){
   const batch=fb.writeBatch(fb.db);
   batch.set(roomRef,{name:value.trim().slice(0,60),ownerUid:state.user.uid,createdAt:Date.now(),memberCount:1});
   batch.set(memberRef,mem);
   await batch.commit();
   await Promise.all(defaults.map(d=>{let c=newChallenge(d,monday(today()),state.user.uid);return fb.setDoc(fb.doc(fb.db,'rooms',code,'challenges',c.id),c)}));
  }else{
   await fb.runTransaction(fb.db,async tx=>{
    const room=await tx.get(roomRef),membership=await tx.get(memberRef);
    if(!room.exists())throw Error('Invite code not found.');
    if(membership.exists())return;
    const count=Number(room.data().memberCount);
    if(!Number.isFinite(count))throw Error('This group was created with an older version. Contact its owner.');
    if(count>=8)throw Error('This group is full (8 friends).');
    tx.update(roomRef,{memberCount:count+1});
    tx.set(memberRef,mem);
   });
  }
  startRoom(code);
  alertToast(type==='create'?'Group created! Copy your invite link.':'Joined the group!');
 }catch(e){console.error(e);alertToast('Could not '+(type==='join'?'join':'create')+' group: '+e.message,true)}
}
document.addEventListener('click',async e=>{if(e.target.matches('.modal-cover')){closeModal();return}const b=e.target.closest('[data-act]');if(b){e.preventDefault();try{await act(b.dataset.act,b)}catch(err){console.error(err);alertToast('Operation failed: '+err.message,true)}return}if(e.target.id==='googleSignIn'){if(!fb)return alertToast('Still connecting. Try again.',true);try{await fb.signInWithPopup(fb.auth,new fb.GoogleAuthProvider())}catch(err){console.error(err);alertToast('Google sign-in did not finish. Try email sign-in below instead. ('+err.code+')',true)}}
 if(e.target.matches('[data-auth-mode]')){const mode=e.target.dataset.authMode;const form=$('#emailAuthForm');if(form){form.dataset.mode=mode;$('#registerNameField').style.display=mode==='register'?'block':'none';$('#registerName').required=mode==='register';$('#emailPassword').autocomplete=mode==='register'?'new-password':'current-password';$('#emailAuthSubmit').textContent=mode==='register'?'Create account →':'Sign in with email →';document.querySelectorAll('[data-auth-mode]').forEach(x=>x.classList.toggle('selected',x.dataset.authMode===mode))}}if(e.target.matches('[data-roomtab]')){const t=e.target.dataset.roomtab,form=$('#roomForm');form.dataset.roomtype=t;$('#roomText').value=t==='create'?'The Consistency Club':(new URLSearchParams(location.search)).get('room')||'';$('#roomText').maxLength=t==='create'?60:8;$('#roomText').previousElementSibling.textContent=t==='create'?'Group name':'8-character invite code';form.querySelector('button[type=submit]').textContent=t==='create'?'Create group →':'Join my friends →';document.querySelectorAll('[data-roomtab]').forEach(x=>x.classList.toggle('active',x.dataset.roomtab===t))}});
document.addEventListener('submit',async e=>{if(e.target.id==='emailAuthForm'){
 e.preventDefault();if(!fb)return alertToast('Still connecting. Please try again.',true);
 const form=e.target,mode=form.dataset.mode,button=form.querySelector('[type=submit]');button.disabled=true;
 const email=form.elements.namedItem('email').value.trim(),password=form.elements.namedItem('password').value;
 try{if(mode==='register'){
   const name=form.elements.namedItem('name').value.trim();if(!name)throw Error('Please enter your name.');
   const result=await fb.createUserWithEmailAndPassword(fb.auth,email,password);
   await fb.updateProfile(result.user,{displayName:name.slice(0,45)});
   state.user={uid:result.user.uid,name:name.slice(0,45)};
   if(!state.room)renderSetup();
  }else await fb.signInWithEmailAndPassword(fb.auth,email,password);
 }catch(err){console.error(err);alertToast((err.code==='auth/email-already-in-use'?'Account exists. Choose Sign in.':err.code==='auth/invalid-credential'?'Incorrect email or password.':err.code==='auth/weak-password'?'Use a stronger password.':err.code==='auth/operation-not-allowed'?'Email sign-in is not enabled in Firebase yet.':err.message),true)}finally{button.disabled=false}return
 }if(e.target.id==='challengeForm'){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const c=newChallenge(data,state.week,state.user.uid,state.week===monday(today())?today():state.week);if(!data.title.trim()||!Number.isFinite(c.target)||c.target<=0)return alertToast('Enter a challenge name and positive target',true);if(weekChallenges().some(a=>a.title.trim().toLowerCase()===c.title.trim().toLowerCase()))return alertToast('This challenge already exists this week',true);try{await doSaveChallenge(c);state.modal=null;render()}catch(err){alertToast(err.message,true)}return}if(e.target.id==='roomForm'){e.preventDefault();const form=e.target,submit=form.querySelector('button[type=submit]');submit.disabled=true;try{await createOrJoin(form.dataset.roomtype,form.roomText.value)}finally{submit.disabled=false}}});
document.addEventListener('change',async e=>{if(e.target.matches('[data-log]')){const {challenge,date}=e.target.dataset;try{await saveLog(challenge,date,e.target.value)}catch(err){alertToast('Could not save: '+err.message,true)}}if(e.target.id==='importFile'){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.members)||!Array.isArray(obj.challenges)||!Array.isArray(obj.logs))throw Error('Invalid backup');state.members=obj.members;state.challenges=obj.challenges;state.logs=obj.logs;state.user=state.members.find(m=>m.uid===obj.userId)||state.members[0];state.roomName=obj.roomName||'The Consistency Club';saveDemo();state.modal=null;render();alertToast('Backup imported')}catch(err){alertToast(err.message,true)}}});
// Never present a locally stored demo as a live multi-user club.
// In a deployed site without Firebase configuration, show an honest setup screen.
const demoModeRequested = new URLSearchParams(location.search).get('demo') === '1' ||
 location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname);
if (cloudMode) {
 renderSetup();
 firebaseInit();
} else if (demoModeRequested) {
 initDemo();
} else {
 $('#root').innerHTML = `<div class="app"><div class="setup">
  <div class="flex" style="margin-bottom:28px"><div class="brandmark">✓</div><div class="brand">BETTER TOGETHER</div></div>
  <div class="card highlight"><div class="eyebrow">ALMOST READY</div>
   <h1>The Friends Challenge Club is waiting for setup.</h1>
   <p class="muted">The owner has not connected Firebase yet. Registration and shared tracking are unavailable until that is done.</p>
   <p class="footnote">If you are the owner, follow the setup instructions in README.md to connect Firebase Authentication, Firestore security rules, and this site's web configuration.</p>
   <a href="?demo=1" class="button" style="display:inline-block;text-decoration:none;margin-top:13px">Try a local demo →</a>
  </div></div></div>`;
}
</script>
